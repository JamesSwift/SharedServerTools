# SharedServerTools Dovecot 2.4 overrides for Ubuntu 26.04 LTS.
# Drop-in: /etc/dovecot/conf.d/99-sharedservertools.conf
# Dovecot 2.4 renamed ssl_* and split mail_location; do not reuse 2.3 files.

ssl = required
ssl_server_cert_file = /etc/letsencrypt/live/__HOSTNAME_FULL__/fullchain.pem
ssl_server_key_file = /etc/letsencrypt/live/__HOSTNAME_FULL__/privkey.pem
ssl_min_protocol = TLSv1.2

# Match Exim maildir_home ($home/Maildir) and Debian's localdelivery=maildir_home.
mail_driver = maildir
mail_path = ~/Maildir
mail_inbox_path = ~/Maildir
mail_privileged_group = mail

auth_mechanisms = plain login

# Socket Exim's dovecot authenticator uses (see conf.d/auth/40_dovecot).
service auth {
  unix_listener auth-userdb {
  }

  unix_listener auth-client {
    mode = 0660
    group = Debian-exim
  }
}
