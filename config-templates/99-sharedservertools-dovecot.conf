# Dovecot 2.4 drop-in: /etc/dovecot/conf.d/99-sharedservertools.conf

ssl = required
ssl_server_cert_file = /etc/letsencrypt/live/__HOSTNAME_FULL__/fullchain.pem
ssl_server_key_file = /etc/letsencrypt/live/__HOSTNAME_FULL__/privkey.pem
ssl_min_protocol = TLSv1.2

mail_driver = maildir
mail_path = ~/Maildir
mail_inbox_path = ~/Maildir
mail_privileged_group = mail

auth_mechanisms = plain login

service auth {
  unix_listener auth-userdb {
  }

  unix_listener auth-client {
    mode = 0660
    group = Debian-exim
  }
}

# IMAP MOVE/COPY into Junk/Spam/"my spam" trains Bayes (report-spam /
# report-ham). Full Dovecot restart is required for imap-sieve changes
# (reload is not enough).
protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}

sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

sieve_global_extensions {
  vnd.dovecot.pipe = yes
  vnd.dovecot.environment = yes
}

sieve_pipe_bin_dir = /usr/lib/dovecot/sieve

# Nested under namespace inbox so this merges with Debian's special_use
# Junk mailbox (a top-level mailbox Junk {} would not).
namespace inbox {
  mailbox Junk {
    sieve_script report-spam {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/report-spam.sieve
    }
  }

  mailbox Spam {
    sieve_script report-spam {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/report-spam.sieve
    }
  }

  mailbox "my spam" {
    sieve_script report-spam {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/report-spam.sieve
    }
  }

  imapsieve_from Junk {
    sieve_script report-ham {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/report-ham.sieve
    }
  }

  imapsieve_from Spam {
    sieve_script report-ham {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/report-ham.sieve
    }
  }

  imapsieve_from "my spam" {
    sieve_script report-ham {
      type = before
      cause = copy
      path = /etc/dovecot/sieve/report-ham.sieve
    }
  }
}
